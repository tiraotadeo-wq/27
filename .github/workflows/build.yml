name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls /Applications | grep "^Xcode" | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos || true

      # ── GBox / sideload build (minimal entitlements, signable with any cert) ──
      - name: Build – GBox/sideload
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            PRODUCT_BUNDLE_IDENTIFIER="com.apple.mobile.MobileHouseArrest" \
            CONFIGURATION_BUILD_DIR="$PWD/build/gbox" \
            build 2>&1 | tee build_gbox.log | grep -E "error:|warning:|BUILD" | head -80 || \
            (grep "error:" build_gbox.log | head -30; exit 1)

      - name: Package IPA – GBox
        run: |
          APP=$(find "$PWD/build/gbox" -name "*.app" 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -path "*/Release-iphoneos/*" 2>/dev/null | head -1)
          fi
          echo "App: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r 3105-v3.0-gbox.ipa Payload/
          rm -rf Payload
          ls -lh 3105-v3.0-gbox.ipa

      - name: Upload IPA – GBox/sideload
        uses: actions/upload-artifact@v4
        with:
          name: 3105-v3.0-gbox-sideload
          path: 3105-v3.0-gbox.ipa
          retention-days: 90
